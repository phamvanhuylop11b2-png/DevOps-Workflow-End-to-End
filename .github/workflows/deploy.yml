# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Tự động deploy website lên GitHub Pages mỗi khi push code
# ============================================================

name: Deploy to GitHub Pages

# === Khi nào pipeline chạy? ===
on:
  push:
    branches: [main]       # Chạy khi push lên nhánh main
  workflow_dispatch:        # Cho phép chạy thủ công từ GitHub UI

permissions:
  contents: write

# === Các job trong pipeline ===
jobs:
  # Job 1: Build & Deploy
  build-and-deploy:
    runs-on: ubuntu-latest   # Chạy trên máy ảo Ubuntu (free)

    steps:
      # Step 1: Checkout code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kiểm tra các file trang web
      - name: Validate Files
        run: |
          echo "Checking essential website files..."
          for file in index.html about.html contact.html avatar.webp avatar.png; do
            if [ -f "$file" ]; then
              echo "✅ $file found! File size: $(wc -c < "$file") bytes"
            else
              echo "❌ $file NOT found!"
              exit 1
            fi
          done

      # Step 3: Run Lighthouse CI Audit (Bài tập mở rộng — Kiểm tra cả 3 trang)
      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://phamvanhuylop11b2-png.github.io/DevOps-Workflow-End-to-End/
            https://phamvanhuylop11b2-png.github.io/DevOps-Workflow-End-to-End/about.html
            https://phamvanhuylop11b2-png.github.io/DevOps-Workflow-End-to-End/contact.html
          uploadArtifacts: true
          temporaryPublicStorage: true

      # Step 4: Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "Auto-deploy from CI pipeline"
