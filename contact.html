<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 48px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .nav a {
            text-decoration: none;
            color: #1e1b4b;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            transition: all 0.25s ease;
            font-size: 14px;
        }

        .nav a:hover {
            background: #3730a3;
            color: #ffffff;
            border-color: #3730a3;
            box-shadow: 0 4px 12px rgba(55, 48, 163, 0.35);
        }

        .nav a.active {
            background: #312e81;
            color: #ffffff;
            border-color: #312e81;
            box-shadow: 0 4px 12px rgba(49, 46, 129, 0.4);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3730a3;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(49, 46, 129, 0.25);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        h1 {
            color: #1e1b4b;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        h2 {
            color: #3730a3;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .contact-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 24px;
            margin: 20px 0;
            text-align: left;
            border-left: 4px solid #312e81;
            color: #0f172a;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin: 14px 0;
            font-size: 15px;
            color: #0f172a;
        }

        .contact-item:first-child {
            margin-top: 0;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-item span.icon {
            font-size: 20px;
            margin-right: 12px;
            width: 28px;
            text-align: center;
        }

        .contact-item strong {
            color: #0f172a;
        }

        .contact-item a {
            color: #312e81;
            text-decoration: underline;
            font-weight: 600;
            word-break: break-all;
            transition: color 0.2s ease;
        }

        .contact-item a:hover {
            color: #4338ca;
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #475569;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }

        .footer p {
            color: #475569;
        }
    </style>
</head>
