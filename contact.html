<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ — Phạm Văn Huy Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px 48px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .nav a {
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            background: #f0f2f5;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .nav a:hover,
        .nav a.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        h1 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 28px;
        }

        h2 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 500;
        }

        .contact-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 24px;
            margin: 20px 0;
            text-align: left;
            border-left: 4px solid #667eea;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin: 14px 0;
            font-size: 15px;
        }

        .contact-item span.icon {
            font-size: 20px;
            margin-right: 12px;
            width: 28px;
            text-align: center;
        }

        .contact-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navigation Menu -->
        <nav class="nav">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html" class="active">Liên hệ</a>
        </nav>

        <img src="avatar.png" alt="Avatar Phạm Văn Huy" class="avatar">
        <h1>Liên Hệ</h1>
        <h2>Thông tin kết nối</h2>

        <div class="contact-box">
            <div class="contact-item">
                <span class="icon">📧</span>
                <div>
                    <strong>Email:</strong>
                    <a href="mailto:phamvanhuylop11b2@gmail.com"> phamvanhuylop11b2@gmail.com</a>
                </div>
            </div>
            <div class="contact-item">
                <span class="icon">🐙</span>
                <div>
                    <strong>GitHub:</strong>
                    <a href="https://github.com/phamvanhuylop11b2-png" target="_blank"> github.com/phamvanhuylop11b2-png</a>
                </div>
            </div>
            <div class="contact-item">
                <span class="icon">🌐</span>
                <div>
                    <strong>Repository:</strong>
                    <a href="https://github.com/phamvanhuylop11b2-png/DevOps-Workflow-End-to-End" target="_blank"> DevOps-Workflow-End-to-End</a>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>DevOps Lab 1 — End-to-End Automation</p>
        </div>
    </div>
</body>

</html>
